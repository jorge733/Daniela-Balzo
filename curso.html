<body data-pagina="cursos-online">
<main id="contenido">
  <section class="banda"><div class="wrap"><p class="vacio">Cargando curso…</p></div></section>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="caja">
    <h2 id="modal-titulo">Comprar curso</h2>
    <div class="resumen"><span id="m-curso"></span><span id="m-precio"></span></div>

    <form class="form" id="paso-cuenta">
      <p class="nota" id="m-ya-cuenta"></p>
      <div id="campos-cuenta">
        <label id="m-campo-nombre">Nombre<input id="m-nombre" autocomplete="name" required></label>
        <label>Correo<input id="m-correo" type="email" autocomplete="email" required></label>
        <label id="m-etiqueta-clave">Crea una contraseña<input id="m-clave" type="password" minlength="6" autocomplete="new-password" required></label>
        <p class="nota">Con este correo y contraseña entrarás a Mis cursos para ver el curso.</p>
        <p class="nota"><button class="enlace" type="button" id="m-modo">¿Ya tienes cuenta? Entra aquí</button>
          <button class="enlace" type="button" id="m-olvide" hidden>Olvidé mi contraseña</button></p>
      </div>
      <p class="error" id="m-error" role="alert"></p>
      <button class="btn mp" type="submit">Pagar con Mercado Pago</button>
      <button class="btn btn-borde" type="button" data-cerrar>Cancelar</button>
    </form>

    <div id="paso-pagando" hidden>
      <p>Te estamos llevando a Mercado Pago para pagar de forma segura…</p>
      <div class="barra cargando"><span></span></div>
    </div>
  </div>
</div>

<script src="assets/js/datos.js"></script>
<script src="assets/js/contenido.js"></script>
<script src="assets/js/layout.js"></script>
<script type="module" src="assets/js/tienda.js"></script>
</body>
