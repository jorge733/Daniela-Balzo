<!doctype html>
<!-- Imagen que se ve al compartir el sitio por WhatsApp, Facebook, etc. (1200x630).
     Se convierte en assets/img/compartir.jpg con: node scripts/vista-previa.mjs -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,400..800&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #180051; color: #fff; font-family: "Open Sans", sans-serif; display: grid; grid-template-columns: 1fr 470px; }
  body::before { content: ""; position: absolute; inset: 0; background: url("../assets/img/logo-01.jpg") center / 460px repeat; opacity: .2; }
  .texto { position: relative; padding: 70px 40px 60px 80px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 132px; height: 132px; border-radius: 50%; border: 4px solid #f2c6e6; object-fit: cover; box-shadow: 0 12px 30px rgba(0,0,0,.4); margin-bottom: 26px; }
  .hola { font-family: "Open Sans", sans-serif; font-weight: 600; font-stretch: 75%; font-size: 40px; color: #f2c6e6; line-height: 1.1; margin: 0 0 4px; }
  h1 { font-size: 66px; letter-spacing: .12em; font-weight: 700; margin: 0 0 14px; line-height: 1.05; }
  p { font-stretch: 75%; font-size: 34px; line-height: 1.3; margin: 0; color: #e6dcf5; }
  .pie { margin-top: 30px; display: inline-flex; gap: 12px; }
  .pie span { background: #f2c6e6; color: #180051; font-weight: 700; font-size: 22px; padding: 9px 18px; border-radius: 30px; }
  .foto { position: relative; background: url("../assets/img/inicio-01.jpg") 74% center / cover; }
  .foto::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #180051 0%, rgba(24,0,81,0) 22%); }
</style>
</head>
<body>
  <div class="texto">
    <img class="logo" src="../assets/img/logo-01.jpg" alt="">
    <p class="hola">Negra Mora</p>
    <h1>Daniela Balzo</h1>
    <p>Clases de costura personalizadas desde 2012</p>
    <div class="pie"><span>Presencial</span><span>Online en vivo</span><span>Cursos en video</span></div>
  </div>
  <div class="foto"></div>
</body>
</html>
